{% extends "base.html" %}
{% block title %}Our Gallery | Hardahi{% endblock %}

{% block content %}
<h1 style="color: var(--primary); text-align: center; margin-bottom: 0.3rem;">Our Gallery</h1>
<p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">Photos of Our Village</p>

<div class="gallery-grid">
    <div class="gallery-card">
        <img src="https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=500&q=80" class="gallery-img" alt="Temple">
        <div class="gallery-title">Our Temple</div>
    </div>
    <div class="gallery-card">
        <img src="https://images.unsplash.com/photo-1582213782179-e0d53f98f2ca?auto=format&fit=crop&w=500&q=80" class="gallery-img" alt="School">
        <div class="gallery-title">Gram School</div>
    </div>
    <div class="gallery-card">
        <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=500&q=80" class="gallery-img" alt="Banyan Tree">
        <div class="gallery-title">Chaupal</div>
    </div>
    <div class="gallery-card">
        <img src="https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=500&q=80" class="gallery-img" alt="Road">
        <div class="gallery-title">Village Entry Road</div>
    </div>
    <div class="gallery-card">
        <img src="https://images.unsplash.com/photo-1599839575945-a9e5af0c3fa5?auto=format&fit=crop&w=500&q=80" class="gallery-img" alt="Fields">
        <div class="gallery-title">Green Fields</div>
    </div>
    <div class="gallery-card">
        <img src="https://images.unsplash.com/photo-1518495973542-4542c06a5843?auto=format&fit=crop&w=500&q=80" class="gallery-img" alt="Pond">
        <div class="gallery-title">Village Pond</div>
    </div>
</div>
{% endblock %}
